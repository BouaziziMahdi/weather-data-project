name: Weather CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Unit tests and ingestion coverage
        run: >-
          python -m pytest
          --cov=src.weather --cov=src.messaging --cov-branch
          --cov-fail-under=95 --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn

  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Create disposable CI environment
        run: python ci/create_env.py
      - name: Validate Compose
        run: docker compose --env-file .env config --quiet
      - name: Build Airflow image
        run: docker build -f dockerFile.airflow -t weather-airflow:ci .
      - name: Test DAG with real Airflow and Spark provider
        run: >-
          docker run --rm --env-file .env
          -e PYTHONPATH=/opt/airflow
          -e AIRFLOW__CORE__LOAD_EXAMPLES=False
          -v "$PWD/dags:/opt/airflow/dags:ro"
          -v "$PWD/src:/opt/airflow/src:ro"
          -v "$PWD/ci:/opt/airflow/ci:ro"
          --entrypoint python weather-airflow:ci /opt/airflow/ci/check_dag.py
      - name: Test Silver and Gold with real Spark
        run: >-
          docker run --rm -e PYTHONPATH=/opt/airflow -e SPARK_LOCAL_IP=127.0.0.1
          -v "$PWD/src:/opt/airflow/src:ro"
          -v "$PWD/ci:/opt/airflow/ci:ro"
          --entrypoint python weather-airflow:ci /opt/airflow/ci/check_spark.py
